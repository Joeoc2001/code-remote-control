name: Build & Push Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Sunday at 4 AM UTC to catch dependency updates
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          df -h
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          fi
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image names
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "APP_IMAGE=ghcr.io/${REPO}" >> $GITHUB_ENV
          echo "ENV_IMAGE=ghcr.io/${REPO}-env" >> $GITHUB_ENV

      - name: Build environment image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.env
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=env
          cache-to: type=gha,mode=min,scope=env
          tags: |
            ${{ env.ENV_IMAGE }}:latest
            ${{ env.ENV_IMAGE }}:${{ github.sha }}

      - name: Prune Docker data before app image build
        run: |
          docker image prune -af || true
          docker builder prune -af || true

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=min,scope=app
          build-args: |
            BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}

      - name: Boot app image
        run: |
          mkdir smoke-configs
          echo '{"root_domain":"smoke.localhost","git":{"email":"smoke@example.com","username":"smoke"},"configurations":[]}' > smoke-configs/environments.json
          docker run -d --name app-smoke -e GITHUB_TOKEN=smoke -v "$PWD/smoke-configs:/configs:ro" -p 3000:3000 "${APP_IMAGE}:${{ github.sha }}"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/build-info; then
              echo
              docker rm -f app-smoke
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond on /api/build-info" >&2
          docker logs app-smoke >&2
          docker rm -f app-smoke
          exit 1

      - name: Push app image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          push: true
          cache-from: type=gha,scope=app
          build-args: |
            BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
